<!DOCTYPE html>
<html>
<head>
<meta charset='UTF-8'>
<link href='https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap' rel='stylesheet'>
<style>
:root { --ac: __ACCENT__; --acrgb: __ACCENT_RGB__; }
html, body { margin: 0; padding: 0; background: #0a0e17; color: #bdc3c7; font-family: 'Share Tech Mono', Consolas, monospace; }
body { padding: 18px 22px 36px 22px; text-align: center; }
#wrap { max-width: 880px; margin: 0 auto; }

/* ---- Ρύθμιση συνεδρίας ---- */
#setup { margin-bottom: 8px; }
select, input[type=text] { background: #111b24; border: 1px dashed #34495e; color: #f1c40f; padding: 12px; border-radius: 6px; font-family: 'Share Tech Mono', Consolas, monospace; font-size: 1rem; outline: none; box-sizing: border-box; }
select:focus, input[type=text]:focus { border-color: #f1c40f; }
#course { width: 33%; margin-right: 1%; }
#mission { width: 65%; }
option { background: #111b24; color: #ecf0f1; }

/* ---- Ρολόι ---- */
#mode { color: #f39c12; font-size: 1.15rem; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 14px; }
#timer { font-size: 6.5rem; letter-spacing: 2px; margin: 6px 0; color: var(--ac); text-shadow: 0 0 18px var(--ac); }
#bar { height: 12px; background: rgba(255,255,255,0.06); border-radius: 10px; border: 1px solid #1a252f; margin: 14px 0; overflow: hidden; }
#fill { height: 100%; width: 100%; background: var(--ac); box-shadow: 0 0 10px var(--ac); }
.btn { display: inline-block; cursor: pointer; background: #111b24; color: #ecf0f1; border: 1px solid #34495e; padding: 12px 26px; border-radius: 6px; margin: 0 5px 8px 5px; font-size: 1rem; }
.btn:hover { border-color: var(--ac); color: var(--ac); }
.btn.warn { border-color: #e67e22; color: #e67e22; }
.btn.zen { border-color: #a29bfe; color: #a29bfe; }
.btn.zen:hover { background: rgba(162,155,254,0.12); }
#modebtn { display: block; cursor: pointer; border: 1px solid #e67e22; color: #e67e22; border-radius: 6px; padding: 11px; margin: 4px 5px 14px 5px; }

/* ---- Ρυθμίσεις ---- */
#cfg { margin: 6px 0 22px 0; color: #7f8c8d; font-size: 0.9rem; }
.chip { display: inline-block; cursor: pointer; border: 1px solid #1f2d3d; background: #0d1520; color: #bdc3c7; border-radius: 999px; padding: 4px 11px; margin: 0 3px; }
.chip.on { background: var(--ac); border-color: var(--ac); color: #05070a; font-weight: bold; }
.cfglbl { margin-left: 14px; margin-right: 4px; }

/* ---- Στατιστικά ---- */
.sec { color: #7f8c8d; font-size: 0.8rem; letter-spacing: 2px; text-align: left; border-bottom: 1px dashed #34495e; padding-bottom: 6px; margin: 24px 0 12px 0; }
.card { display: inline-block; vertical-align: top; width: 23.5%; margin: 0 0.5% 8px 0.5%; background: #0d1520; border: 1px solid #1f2d3d; border-radius: 10px; padding: 14px 6px; box-sizing: border-box; }
.card .v { font-size: 1.7rem; color: #ecf0f1; }
.card .l { font-size: 0.78rem; color: #7f8c8d; margin-top: 3px; }
.card.hot .v { color: #ff9f43; }
.crow { text-align: left; margin-bottom: 9px; }
.crow .nm { font-size: 0.88rem; color: #ecf0f1; margin-bottom: 3px; }
.crow .nm b { color: var(--ac); }
.crow .tm { float: right; color: #7f8c8d; }
.crow .tr { background: #0d1520; border-radius: 6px; height: 9px; overflow: hidden; }
.crow .fl { height: 100%; background: var(--ac); border-radius: 6px; }
table.heat { border-collapse: separate; border-spacing: 4px; margin: 0 auto; }
table.heat td.dl { color: #5d6d7e; font-size: 0.72rem; width: 16px; padding: 0; text-align: right; }
table.heat td.hc { width: 26px; height: 22px; border-radius: 4px; padding: 0; }
.hint { color: #5d6d7e; font-size: 0.8rem; margin-top: 12px; }


/* ---- Επόμενα (πρόγραμμα) ---- */
#agenda .box { background: #0d1520; border: 1px solid #1f2d3d; border-left: 4px solid var(--ac); border-radius: 10px; padding: 12px 16px; text-align: left; margin-bottom: 10px; }
#agenda .k { color: #7f8c8d; font-size: 0.75rem; letter-spacing: 2px; }
#agenda .v { color: #ecf0f1; font-size: 1.05rem; margin-top: 3px; }
#agenda .v b { color: var(--ac); }
#agenda .s { color: #7f8c8d; margin-top: 3px; font-size: 0.88rem; }
#agenda .go { display: inline-block; margin-top: 8px; cursor: pointer; border: 1px solid var(--ac); color: var(--ac); border-radius: 6px; padding: 6px 14px; }
#agenda .go:hover { background: rgba(var(--acrgb),0.12); }
.xrow { text-align: left; padding: 8px 0; border-bottom: 1px dashed #1a2536; font-size: 0.92rem; color: #ecf0f1; }
.xrow b { color: var(--ac); }
.xrow .d { float: right; color: #ff9f43; }
.xrow .s { color: #7f8c8d; font-size: 0.82rem; margin-top: 2px; }
#zenNext { display: none; color: #7f8c8d; margin-top: 1vh; font-size: 1rem; }
#zenNext.soon { color: #ff9f43; }
body.zen #zenNext { display: block; }


/* ---- Ειδοποίηση επιτεύγματος ---- */
#toast { display: none; position: fixed; top: 18px; left: 50%; margin-left: -230px; width: 460px; z-index: 20; box-sizing: border-box; text-align: center;
  background: rgba(13,21,32,0.96); border: 1px solid #f1c40f; color: #f1c40f; border-radius: 12px; padding: 12px 18px; font-size: 1rem;
  box-shadow: 0 0 24px rgba(241,196,15,0.35); }

/* ---- ZEN MODE ---- */
#topbar { display: none; position: fixed; top: 16px; right: 20px; z-index: 5; }
.zbtn { display: inline-block; cursor: pointer; border: 1px solid #2c3e50; background: rgba(13,21,32,0.85); color: #bdc3c7; border-radius: 8px; padding: 8px 14px; margin-left: 8px; font-size: 0.9rem; }
.zbtn:hover { border-color: var(--ac); color: var(--ac); }
#zenwho { display: none; color: #7f8c8d; font-size: 1.15rem; margin-top: 6vh; letter-spacing: 1px; }
#zenwho b { color: #f1c40f; font-weight: normal; }
body.zen { background: radial-gradient(ellipse at center, #0d1522 0%, #05070a 75%); }
body.zen .normal { display: none !important; }
body.zen #topbar { display: block; }
body.zen #zenwho { display: block; }
body.zen #mode { margin-top: 3vh; font-size: 1.3rem; }
body.zen #timer { font-size: 12rem; font-size: min(30vh, 21vw); margin: 2vh 0; }
body.zen #bar { max-width: 640px; margin: 3vh auto; height: 6px; }
body.zen .btn { padding: 12px 34px; }
</style>
</head>
<body>
<div id='toast'></div>
<div id='topbar'>
  <span class='zbtn' id='zNotes'>📝 Σημειώσεις</span><span class='zbtn' id='zRadio'>📻 Ράδιο</span><span class='zbtn' id='zExit'>✕ Έξοδος (Esc)</span>
</div>

<div id='wrap'>
  <div id='setup' class='normal'>
    <select id='course'></select><input type='text' id='mission' placeholder='🎯 Αποστολή: τι θα κάνεις σε αυτόν τον κύκλο;'>
  </div>
  <div id='zenwho'></div>

  <div id='mode'>SYSTEM STANDBY</div>
  <div id='timer'>30:00</div>
  <div id='bar'><div id='fill'></div></div>

  <div>
    <span class='btn' id='bStart'>START</span><span class='btn' id='bPause'>PAUSE</span><span class='btn' id='bReset'>RESET</span><span class='btn zen normal' id='bZen'>🧘 ZEN MODE</span>
  </div>
  <div id='zenNext'></div>
  <div id='modebtn' class='normal'>SWITCH TO REST MODE</div>
  <div id='cfg' class='normal'></div>

  <div id='agenda' class='normal'>
    <div class='sec'>🗓️ ΕΠΟΜΕΝΑ</div>
    <div id='nextbox'></div>
    <div id='exams'></div>
  </div>

  <div id='stats' class='normal'>
    <div class='sec'>📊 ΣΤΑΤΙΣΤΙΚΑ ΜΕΛΕΤΗΣ</div>
    <div id='cards'></div>
    <div class='sec'>📚 ΑΝΑ ΜΑΘΗΜΑ</div>
    <div id='bycourse'></div>
    <div class='sec'>🗓️ ΤΕΛΕΥΤΑΙΕΣ 10 ΕΒΔΟΜΑΔΕΣ</div>
    <div id='heat'></div>
    <div class='hint'>Μετράνε μόνο οι ολοκληρωμένοι κύκλοι εργασίας. Space = έναρξη/παύση.</div>
  </div>
</div>

<script>
var SETTINGS = __SETTINGS__;
var LOG = __LOG__;
var COURSES = __COURSES__;
var NAMES = __NAMES__;
var TOTAL = __TOTAL__;
var AGENDA = (typeof __AGENDA__ === 'undefined') ? {} : __AGENDA__;

if (!SETTINGS) SETTINGS = {};
if (!SETTINGS.work) SETTINGS.work = 30;
if (!SETTINGS.rest) SETTINGS.rest = 5;
if (!SETTINGS.course) SETTINGS.course = '';
SETTINGS.autoZen = !!SETTINGS.autoZen;
if (!TOTAL) TOTAL = { minutes: 0, cycles: 0 };
if (!AGENDA) AGENDA = {};
if (!AGENDA.lectures) AGENDA.lectures = [];
if (!AGENDA.exams) AGENDA.exams = [];
var DAYS_FULL = ['Δευτέρα', 'Τρίτη', 'Τετάρτη', 'Πέμπτη', 'Παρασκευή'];

var isWork = true, running = false, endAt = 0, timeLeft = SETTINGS.work * 60, totalTime = timeLeft;
var zen = false, autoEntered = false, audioCtx = null;
var WORK_OPTS = [25, 30, 45, 50], REST_OPTS = [5, 10, 15];
var DAYS_SHORT = ['Δ', 'Τ', 'Τ', 'Π', 'Π', 'Σ', 'Κ'];

function $(id) { return document.getElementById(id); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;'); }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function post(o) { try { if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(JSON.stringify(o)); } catch (e) { } }
function fmtMin(m) { if (m < 60) return m + 'λ'; var h = Math.floor(m / 60), r = m % 60; return h + 'ω' + (r ? ' ' + r + 'λ' : ''); }
function courseTitle(c) { if (!c) return 'Γενικό'; return NAMES[c] ? NAMES[c] : c; }

/* ---------- ΗΧΟΣ (χωρίς internet) ---------- */
function initAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { }
}
function beep() {
  try {
    initAudio(); if (!audioCtx) return;
    var t0 = audioCtx.currentTime, freqs = [660, 880, 1320], i;
    for (i = 0; i < freqs.length; i++) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain(), st = t0 + i * 0.22;
      o.type = 'sine'; o.frequency.value = freqs[i];
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(0.25, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.2);
      o.connect(g); g.connect(audioCtx.destination); o.start(st); o.stop(st + 0.22);
    }
  } catch (e) { }
}

/* ---------- ΡΟΛΟΙ ---------- */
function setModeText(t, color) { $('mode').textContent = t; $('mode').style.color = color || '#f39c12'; }
function updateDisplay() {
  var m = Math.floor(timeLeft / 60), s = timeLeft % 60;
  $('timer').textContent = pad(m) + ':' + pad(s);
  $('fill').style.width = (totalTime > 0 ? (timeLeft / totalTime * 100) : 0) + '%';
  document.title = (running ? pad(m) + ':' + pad(s) + ' · ' : '') + 'Focus Core';
}
function paint(color) {
  $('timer').style.color = color; $('timer').style.textShadow = '0 0 18px ' + color;
  $('fill').style.background = color; $('fill').style.boxShadow = '0 0 10px ' + color;
}
function updateTheme() {
  if (running) paint(isWork ? '#e74c3c' : '#3498db');
  else if (timeLeft === totalTime) paint('var(--ac)');
  else paint('#f1c40f');
}
function secondsFor(work) { return (work ? SETTINGS.work : SETTINGS.rest) * 60; }
function updateModeButton() { $('modebtn').textContent = isWork ? 'SWITCH TO REST MODE' : 'SWITCH TO WORK MODE'; }

function startTimer() {
  if (running) return;
  initAudio();
  if (timeLeft <= 0) { timeLeft = totalTime = secondsFor(isWork); }
  endAt = new Date().getTime() + timeLeft * 1000;
  running = true;
  setModeText(isWork ? 'DEEP DIVE: ACTIVE' : 'COOLING PROTOCOL', isWork ? '#e74c3c' : '#3498db');
  if (isWork && SETTINGS.autoZen && !zen) { autoEntered = true; post({ type: 'zen', action: 'enter' }); }
  updateTheme(); updateDisplay();
}
function pauseTimer() {
  if (!running) return;
  timeLeft = Math.max(1, Math.ceil((endAt - new Date().getTime()) / 1000));
  running = false;
  setModeText('SYSTEM PAUSED', '#f1c40f'); updateTheme(); updateDisplay();
}
function resetTimer() {
  running = false; totalTime = secondsFor(isWork); timeLeft = totalTime;
  setModeText('SYSTEM STANDBY'); updateTheme(); updateDisplay();
}
function toggleMode() { isWork = !isWork; updateModeButton(); resetTimer(); }

function recordSession(whenMs) {
  var w = new Date(whenMs);
  var s = { d: iso(w), t: pad(w.getHours()) + ':' + pad(w.getMinutes()), c: SETTINGS.course || '', m: SETTINGS.work };
  LOG.push(s); TOTAL.minutes += s.m; TOTAL.cycles += 1;
  post({ type: 'focus', action: 'session', session: s });
  renderStats();
}
function finish() {
  var wasWork = isWork, when = endAt;
  running = false; beep();
  if (wasWork) recordSession(when);
  toggleMode();
  setModeText(wasWork ? 'ΚΥΚΛΟΣ ΟΛΟΚΛΗΡΩΘΗΚΕ ✓  ΔΙΑΛΕΙΜΜΑ' : 'ΕΤΟΙΜΟΣ ΓΙΑ ΝΕΟ ΚΥΚΛΟ', '#2ecc71');
  if (wasWork && zen && autoEntered) { autoEntered = false; post({ type: 'zen', action: 'exit' }); }
}
function tick() {
  if (!running) return;
  var remaining = Math.ceil((endAt - new Date().getTime()) / 1000);
  if (remaining <= 0) { timeLeft = 0; updateDisplay(); finish(); return; }
  if (remaining !== timeLeft) { timeLeft = remaining; updateDisplay(); }
}

/* ---------- ΣΤΑΤΙΣΤΙΚΑ ---------- */
function computeStats() {
  var now = new Date(), byDay = {}, byCourse = {}, i, s;
  for (i = 0; i < LOG.length; i++) {
    s = LOG[i]; byDay[s.d] = (byDay[s.d] || 0) + s.m;
    var k = s.c || ''; byCourse[k] = (byCourse[k] || 0) + s.m;
  }
  var todayIso = iso(now), todayMin = byDay[todayIso] || 0, todayCycles = 0;
  for (i = 0; i < LOG.length; i++) { if (LOG[i].d === todayIso) todayCycles++; }
  var dow = (now.getDay() + 6) % 7;
  var weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow), weekMin = 0, d;
  for (d = 0; d < 7; d++) { weekMin += byDay[iso(new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + d))] || 0; }
  var streak = 0, cur = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (!byDay[iso(cur)]) cur.setDate(cur.getDate() - 1);
  while (byDay[iso(cur)]) { streak++; cur.setDate(cur.getDate() - 1); }
  return { byDay: byDay, byCourse: byCourse, todayMin: todayMin, todayCycles: todayCycles, weekMin: weekMin, streak: streak, weekStart: weekStart, todayIso: todayIso };
}
function renderStats() {
  var st = computeStats(), h = '';
  h += '<div class="card"><div class="v">' + fmtMin(st.todayMin) + '</div><div class="l">ΣΗΜΕΡΑ · ' + st.todayCycles + ' κύκλοι</div></div>';
  h += '<div class="card"><div class="v">' + fmtMin(st.weekMin) + '</div><div class="l">ΑΥΤΗ ΤΗΝ ΕΒΔΟΜΑΔΑ</div></div>';
  h += '<div class="card' + (st.streak >= 3 ? ' hot' : '') + '"><div class="v">' + (st.streak >= 3 ? '🔥 ' : '') + st.streak + '</div><div class="l">ΣΕΙΡΑ ΗΜΕΡΩΝ</div></div>';
  h += '<div class="card"><div class="v">' + fmtMin(TOTAL.minutes) + '</div><div class="l">ΣΥΝΟΛΟ · ' + TOTAL.cycles + ' κύκλοι</div></div>';
  $('cards').innerHTML = h;

  var arr = [], k;
  for (k in st.byCourse) { if (st.byCourse.hasOwnProperty(k)) arr.push({ c: k, m: st.byCourse[k] }); }
  arr.sort(function (a, b) { return b.m - a.m; });
  var bc = '', max = arr.length ? arr[0].m : 1, n = Math.min(arr.length, 6), i;
  for (i = 0; i < n; i++) {
    bc += '<div class="crow"><div class="nm">' + (arr[i].c ? '<b>' + esc(arr[i].c) + '</b> ' : '') + esc(courseTitle(arr[i].c)) + '<span class="tm">' + fmtMin(arr[i].m) + '</span></div><div class="tr"><div class="fl" style="width:' + Math.max(3, Math.round(arr[i].m / max * 100)) + '%;"></div></div></div>';
  }
  $('bycourse').innerHTML = bc || '<div class="hint">Δεν έχει καταγραφεί ακόμα κύκλος. Ολοκλήρωσε έναν και θα εμφανιστεί εδώ.</div>';

  // Heatmap: 10 εβδομάδες (στήλες) x 7 ημέρες (γραμμές)
  var w, r, ht = '<table class="heat">';
  for (r = 0; r < 7; r++) {
    ht += '<tr><td class="dl">' + DAYS_SHORT[r] + '</td>';
    for (w = 0; w < 10; w++) {
      var dt = new Date(st.weekStart.getFullYear(), st.weekStart.getMonth(), st.weekStart.getDate() - 7 * (9 - w) + r);
      var key = iso(dt), mins = st.byDay[key] || 0, future = key > st.todayIso;
      var a = mins === 0 ? 0 : mins < 30 ? 0.3 : mins < 60 ? 0.55 : mins < 120 ? 0.8 : 1;
      var bg = a === 0 ? '#111b24' : 'rgba(var(--acrgb),' + a + ')';
      ht += '<td class="hc" style="background:' + bg + ';' + (future ? 'opacity:0.25;' : '') + '" title="' + key + ' · ' + fmtMin(mins) + '"></td>';
    }
    ht += '</tr>';
  }
  $('heat').innerHTML = ht + '</table>';
}


/* ---------- ΕΠΟΜΕΝΑ ΑΠΟ ΤΟ ΠΡΟΓΡΑΜΜΑ ---------- */
function toMin(t) { var p = t.split(':'); return parseInt(p[0], 10) * 60 + parseInt(p[1], 10); }
function parseIso(x) { var p = x.split('-'); return new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10)); }
function countdown(ms) {
  var m = Math.round(ms / 60000);
  if (m < 60) return m + 'λ';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'ω ' + (m % 60) + 'λ';
  var d = Math.floor(h / 24);
  return d + (d === 1 ? ' ημέρα' : ' ημέρες') + ' ' + (h % 24) + 'ω';
}
function inTerm(d) {
  if (AGENDA.termStart && d < parseIso(AGENDA.termStart)) return false;
  if (AGENDA.termEnd && d > parseIso(AGENDA.termEnd)) return false;
  return true;
}
function findLectures(now) {
  var L = AGENDA.lectures, cur = null, best = null, off, i;
  var nowMin = now.getHours() * 60 + now.getMinutes();
  for (off = 0; off < 8 && !best; off++) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off), di = (d.getDay() + 6) % 7;
    if (di > 4 || !inTerm(d)) continue;
    for (i = 0; i < L.length; i++) {
      if (L[i].d !== di) continue;
      var a = toMin(L[i].s), b = toMin(L[i].e);
      if (off === 0 && a <= nowMin && nowMin < b) { cur = L[i]; continue; }
      var when = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(a / 60), a % 60);
      if (when > now && (!best || when < best.when)) best = { s: L[i], when: when, off: off };
    }
  }
  return { cur: cur, next: best };
}
function lecTitle(s) { return NAMES[s.c] ? NAMES[s.c] : s.t; }
function renderAgenda() {
  var now = new Date(), snap = findLectures(now), box = '', zn = '', znSoon = false, i;
  var ended = false;
  if (AGENDA.termEnd) { var te = parseIso(AGENDA.termEnd); ended = now > new Date(te.getFullYear(), te.getMonth(), te.getDate() + 1); }

  if (!AGENDA.lectures.length) {
    box = '<div class="box"><div class="k">ΕΠΟΜΕΝΟ ΜΑΘΗΜΑ</div><div class="s">Δεν υπάρχει πρόγραμμα μαθημάτων για τα μαθήματα που βλέπεις στο Schedule. Άνοιξε το tab Schedule για να φορτώσει.</div></div>';
  } else if (ended) {
    box = '<div class="box"><div class="k">ΕΠΟΜΕΝΟ ΜΑΘΗΜΑ</div><div class="v">Το εξάμηνο έχει λήξει</div></div>';
  } else if (AGENDA.termStart && now < parseIso(AGENDA.termStart)) {
    var ts0 = parseIso(AGENDA.termStart), dl = Math.ceil((ts0 - now) / 86400000);
    box = '<div class="box"><div class="k">ΕΠΟΜΕΝΟ ΜΑΘΗΜΑ</div><div class="v">Τα μαθήματα ξεκινούν σε ' + dl + (dl === 1 ? ' ημέρα' : ' ημέρες') + '</div><div class="s">Έναρξη: ' + ts0.getDate() + '/' + (ts0.getMonth() + 1) + '/' + ts0.getFullYear() + '</div></div>';
  } else {
    if (snap.cur) {
      box += '<div class="box"><div class="k">ΤΩΡΑ ΣΕ ΜΑΘΗΜΑ</div><div class="v"><b>' + esc(snap.cur.c) + '</b> ' + esc(lecTitle(snap.cur)) + '</div><div class="s">μέχρι ' + snap.cur.e + (snap.cur.r ? ' · ' + esc(snap.cur.r) : '') + '</div></div>';
      zn = '⏰ Σε μάθημα τώρα: ' + snap.cur.c + ' μέχρι ' + snap.cur.e;
    }
    if (snap.next) {
      var ms = snap.next.when - now, freeMin = Math.floor(ms / 60000), nx = snap.next;
      var line = '<div class="v"><b>' + esc(nx.s.c) + '</b> ' + esc(lecTitle(nx.s)) + '</div><div class="s">' +
        (nx.off === 0 ? 'Σήμερα' : DAYS_FULL[nx.s.d]) + ' ' + nx.s.s + '-' + nx.s.e + (nx.s.r ? ' · ' + esc(nx.s.r) : '') + ' · σε ' + countdown(ms) + '</div>';
      if (nx.off === 0 && !snap.cur) {
        var cyc = SETTINGS.work + SETTINGS.rest, n = Math.floor((freeMin + SETTINGS.rest) / cyc);
        if (n >= 1) line += '<div class="s" style="color:#2ecc71;">Έχεις χρόνο για ' + n + (n === 1 ? ' κύκλο' : ' κύκλους') + ' μελέτης πριν το μάθημα.</div><span class="go" data-go="1">▶ ΞΕΚΙΝΑ ΤΩΡΑ</span>';
        else line += '<div class="s">Λιγότερο από έναν κύκλο ελεύθερος χρόνος: ξεκουράσου ή κάνε μια γρήγορη επανάληψη.</div>';
      }
      box += '<div class="box"><div class="k">ΕΠΟΜΕΝΟ ΜΑΘΗΜΑ</div>' + line + '</div>';
      if (!snap.cur && freeMin <= 180) { zn = '⏰ Επόμενο μάθημα: ' + nx.s.c + ' σε ' + countdown(ms); znSoon = freeMin <= 10; }
    } else if (!snap.cur) {
      box += '<div class="box"><div class="k">ΕΠΟΜΕΝΟ ΜΑΘΗΜΑ</div><div class="v">Δεν υπάρχει επόμενο μάθημα</div></div>';
    }
  }
  $('nextbox').innerHTML = box;
  $('zenNext').textContent = zn; $('zenNext').className = znSoon ? 'soon' : '';

  /* Εξετάσεις: αντίστροφη μέτρηση + πόσο έχεις μελετήσει */
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), up = [], st = computeStats(), lastBy = {};
  for (i = 0; i < LOG.length; i++) { var c0 = LOG[i].c; if (c0 && (!lastBy[c0] || LOG[i].d > lastBy[c0])) lastBy[c0] = LOG[i].d; }
  for (i = 0; i < AGENDA.exams.length; i++) { if (parseIso(AGENDA.exams[i].dt) >= today) up.push(AGENDA.exams[i]); }
  up.sort(function (a, b) { return a.dt < b.dt ? -1 : a.dt > b.dt ? 1 : (toMin(a.s) - toMin(b.s)); });
  var xh = '';
  if (up.length) {
    xh += '<div class="k" style="color:#7f8c8d;font-size:0.75rem;letter-spacing:2px;text-align:left;margin:14px 0 4px 0;">ΠΡΟΣΕΧΕΙΣ ΕΞΕΤΑΣΕΙΣ</div>';
    for (i = 0; i < Math.min(up.length, 5); i++) {
      var ex = up[i], dd = parseIso(ex.dt), days = Math.round((dd - today) / 86400000);
      var mins = st.byCourse[ex.c] || 0, last = lastBy[ex.c];
      var ds = last ? Math.round((today - parseIso(last)) / 86400000) : -1;
      var lastTxt = last ? ' · τελευταία φορά ' + (ds === 0 ? 'σήμερα' : ds === 1 ? 'χθες' : 'πριν ' + ds + ' ημ.') : '';
      xh += '<div class="xrow"><b>' + esc(ex.c) + '</b> ' + esc(NAMES[ex.c] ? NAMES[ex.c] : ex.t) + '<span class="d">' + (days === 0 ? 'ΣΗΜΕΡΑ' : days === 1 ? 'αύριο' : 'σε ' + days + ' ημέρες') + '</span>' +
        '<div class="s">' + DAYS_FULL[ex.d] + ' ' + dd.getDate() + '/' + (dd.getMonth() + 1) + ' · ' + ex.s + '-' + ex.e + ' · μελέτη: ' + (mins ? fmtMin(mins) : 'καμία ακόμα') + lastTxt + '</div></div>';
    }
  } else {
    xh = '<div class="hint">Καμία προσεχής εξέταση στο πρόγραμμα.</div>';
  }
  $('exams').innerHTML = xh;
}

/* ---------- ΡΥΘΜΙΣΕΙΣ ---------- */
function postSettings() {
  post({ type: 'focus', action: 'settings', settings: { work: SETTINGS.work, rest: SETTINGS.rest, autoZen: SETTINGS.autoZen, course: SETTINGS.course } });
}
function buildCourseSelect() {
  var sel = $('course'), h = '<option value="">— Γενικό (χωρίς μάθημα) —</option>', i, found = false;
  for (i = 0; i < COURSES.length; i++) {
    h += '<option value="' + esc(COURSES[i].c) + '">' + esc(COURSES[i].c + ' · ' + COURSES[i].t) + '</option>';
    if (COURSES[i].c === SETTINGS.course) found = true;
  }
  sel.innerHTML = h;
  if (!found) SETTINGS.course = '';
  sel.value = SETTINGS.course;
}
function buildCfg() {
  var h = '<span class="cfglbl">Εργασία:</span>', i;
  for (i = 0; i < WORK_OPTS.length; i++) h += '<span class="chip' + (SETTINGS.work === WORK_OPTS[i] ? ' on' : '') + '" data-w="' + WORK_OPTS[i] + '">' + WORK_OPTS[i] + '\'</span>';
  h += '<span class="cfglbl">Διάλειμμα:</span>';
  for (i = 0; i < REST_OPTS.length; i++) h += '<span class="chip' + (SETTINGS.rest === REST_OPTS[i] ? ' on' : '') + '" data-r="' + REST_OPTS[i] + '">' + REST_OPTS[i] + '\'</span>';
  h += '<span class="cfglbl">Auto-Zen:</span><span class="chip' + (SETTINGS.autoZen ? ' on' : '') + '" data-az="1">' + (SETTINGS.autoZen ? 'ΝΑΙ' : 'ΟΧΙ') + '</span>';
  $('cfg').innerHTML = h;
}
function updateZenWho() {
  var m = $('mission').value.replace(/^\s+|\s+$/g, '');
  $('zenwho').innerHTML = '<b>' + esc(SETTINGS.course ? SETTINGS.course + ' · ' + courseTitle(SETTINGS.course) : 'Γενικό') + '</b>' + (m ? '<br>' + esc(m) : '');
}

/* ---------- ZEN ---------- */
window.setZen = function (on) {
  zen = !!on;
  document.body.className = zen ? 'zen' : '';
  if (!zen) autoEntered = false;
  updateZenWho();
};
var toastTimer = null;
window.showToast = function (msg) {
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  beep();
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.style.display = 'none'; }, 7000);
};
window.setAccent = function (hex, rgb) {
  document.documentElement.style.setProperty('--ac', hex);
  document.documentElement.style.setProperty('--acrgb', rgb);
  renderStats();
};

/* ---------- ΣΥΝΔΕΣΗ ΣΥΜΒΑΝΤΩΝ ---------- */
$('bStart').onclick = startTimer; $('bPause').onclick = pauseTimer; $('bReset').onclick = resetTimer;
$('modebtn').onclick = toggleMode;
$('bZen').onclick = function () { autoEntered = false; post({ type: 'zen', action: 'enter' }); };
$('zExit').onclick = function () { post({ type: 'zen', action: 'exit' }); };
$('zNotes').onclick = function () { post({ type: 'zen', action: 'notes' }); };
$('zRadio').onclick = function () { post({ type: 'zen', action: 'radio' }); };
$('course').onchange = function () { SETTINGS.course = this.value; updateZenWho(); postSettings(); };
$('mission').oninput = updateZenWho;

document.addEventListener('click', function (ev) {
  var t = ev.target, n = 0;
  while (t && t !== document && n < 3) {
    if (t.getAttribute) {
      var w = t.getAttribute('data-w'), r = t.getAttribute('data-r'), az = t.getAttribute('data-az'), go = t.getAttribute('data-go');
      if (go) { if (!running) { if (!isWork) toggleMode(); startTimer(); } return; }
      if (w) { SETTINGS.work = parseInt(w, 10); if (!running && isWork) resetTimer(); buildCfg(); postSettings(); return; }
      if (r) { SETTINGS.rest = parseInt(r, 10); if (!running && !isWork) resetTimer(); buildCfg(); postSettings(); return; }
      if (az) { SETTINGS.autoZen = !SETTINGS.autoZen; buildCfg(); postSettings(); return; }
    }
    t = t.parentNode; n++;
  }
});
document.addEventListener('keydown', function (e) {
  var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
  if (e.key === 'Escape' && zen) { post({ type: 'zen', action: 'exit' }); return; }
  /* Εργαλείο δοκιμής: Ctrl+Shift+F = το ρολόι πάει στα τελευταία 5 δευτερόλεπτα */
  if (e.ctrlKey && e.shiftKey && (e.key === 'F' || e.key === 'f') && running) { endAt = new Date().getTime() + 5000; return; }
  if ((e.key === ' ' || e.code === 'Space') && tag !== 'input' && tag !== 'select' && tag !== 'textarea') {
    e.preventDefault();
    if (running) pauseTimer(); else startTimer();
  }
});

buildCourseSelect(); buildCfg(); updateModeButton(); updateDisplay(); updateTheme(); renderStats(); updateZenWho(); renderAgenda();
setInterval(tick, 250);
setInterval(renderAgenda, 30000);
</script>
